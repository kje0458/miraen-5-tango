<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 마스터 퀴즈 (미래엔 5단원)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
        }
        .jp-text {
            font-family: 'Kosugi Maru', 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div id="app" class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-white/50 p-6 md:p-8 transition-all">

        <!-- 화면 1: 시작 화면 -->
        <div id="screen-start" class="space-y-6 text-center">
            <div class="inline-block p-4 bg-indigo-100 rounded-full text-indigo-600 mb-2">
                <i class="fa-solid fa-graduation-cap text-5xl"></i>
            </div>
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">일본어 단어 퀴즈</h1>
                <p class="text-slate-500 mt-2 text-sm md:text-base">미래엔 고등학교 일본어 5단원 (한자 없음)</p>
            </div>

            <div class="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100 text-left space-y-2">
                <label for="player-name" class="block text-sm font-bold text-slate-700">
                    <i class="fa-solid fa-user text-indigo-500 mr-1"></i> 학생 이름을 입력하세요
                </label>
                <input type="text" id="player-name" placeholder="예: 홍길동" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-semibold text-lg">
            </div>

            <div class="grid grid-cols-2 gap-3 text-left">
                <button onclick="selectQuestionCount(10)" id="btn-count-10" 
                    class="count-btn p-4 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 font-bold flex items-center justify-between">
                    <span>10문제 풀기</span>
                    <i class="fa-solid fa-circle-check"></i>
                </button>
                <button onclick="selectQuestionCount(20)" id="btn-count-20" 
                    class="count-btn p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 hover:border-indigo-300 font-bold flex items-center justify-between">
                    <span>20문제 풀기</span>
                    <i class="fa-regular fa-circle"></i>
                </button>
            </div>

            <div class="flex items-center justify-center space-x-2 text-sm text-slate-500">
                <span>발음 미리듣기:</span>
                <button onclick="speakJapanese('こんにちは')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium flex items-center gap-1 transition">
                    <i class="fa-solid fa-volume-high text-indigo-500"></i> こんにちは (테스트)
                </button>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button onclick="startGame()" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-200 text-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 퀴즈 시작하기
                </button>
                <button onclick="showLeaderboardScreen()" class="px-6 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-lg shadow-amber-100 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trophy"></i> 랭킹 보기
                </button>
            </div>
        </div>

        <!-- 화면 2: 퀴즈 화면 -->
        <div id="screen-quiz" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-slate-100 p-3 rounded-2xl">
                <div class="flex items-center gap-2">
                    <span id="quiz-progress-text" class="text-sm font-bold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full">1 / 10</span>
                    <span id="quiz-type-badge" class="text-xs font-semibold px-2 py-1 bg-slate-200 text-slate-700 rounded-md">뜻 맞추기</span>
                </div>
                <div class="flex items-center gap-4 text-sm font-bold">
                    <div class="text-amber-600 flex items-center gap-1">
                        <i class="fa-solid fa-fire"></i> <span id="combo-count">0</span> 연속
                    </div>
                    <div class="text-emerald-600 flex items-center gap-1">
                        <i class="fa-solid fa-star"></i> <span id="current-score">0</span>점
                    </div>
                </div>
            </div>

            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>

            <div class="bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-100 rounded-3xl p-6 text-center shadow-inner relative">
                <div class="text-xs font-semibold text-indigo-400 mb-1" id="question-category">Q. 제시어의 알맞은 답을 고르세요</div>
                <div id="question-word" class="jp-text text-3xl md:text-4xl font-extrabold text-slate-800 my-4 tracking-wide">
                    ---
                </div>
                <button id="btn-audio-replay" onclick="playCurrentQuestionAudio()" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-full shadow transition">
                    <i class="fa-solid fa-volume-high"></i> 발음 듣기
                </button>
            </div>

            <div id="options-container" class="grid grid-cols-1 gap-3"></div>

            <div id="feedback-box" class="hidden p-4 rounded-2xl border text-sm font-medium transition-all">
                <div class="flex items-start gap-3">
                    <div id="feedback-icon" class="text-xl mt-0.5"></div>
                    <div>
                        <div id="feedback-title" class="font-bold text-base mb-1"></div>
                        <div id="feedback-desc" class="text-slate-600"></div>
                    </div>
                </div>
            </div>

            <button id="btn-next" onclick="nextQuestion()" class="hidden w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                <span>다음 문제로</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- 화면 3: 결과 화면 -->
        <div id="screen-result" class="hidden space-y-6 text-center">
            <div class="inline-block p-4 bg-emerald-100 rounded-full text-emerald-600">
                <i class="fa-solid fa-trophy text-5xl"></i>
            </div>
            <div>
                <h2 class="text-3xl font-extrabold text-slate-900">퀴즈 완료!</h2>
                <p id="result-greeting" class="text-slate-500 mt-1">수고하셨습니다!</p>
            </div>

            <div class="grid grid-cols-3 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <div>
                    <div class="text-xs text-slate-400 font-bold">최종 점수</div>
                    <div id="final-score" class="text-2xl font-black text-indigo-600">0점</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">정답률</div>
                    <div id="final-accuracy" class="text-2xl font-black text-emerald-600">0%</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">맞힌 개수</div>
                    <div id="final-correct-count" class="text-2xl font-black text-amber-600">0 / 0</div>
                </div>
            </div>

            <div class="text-left space-y-3">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-circle-exclamation text-rose-500"></i>
                    <span>복습 피드백 (틀린 문제 해설)</span>
                </h3>
                <div id="incorrect-feedback-list" class="max-h-60 overflow-y-auto space-y-2 pr-1"></div>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button onclick="startGame()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 다시 도전하기
                </button>
                <button onclick="showLeaderboardScreen()" class="px-6 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-list-ol"></i> 랭킹 확인하기
                </button>
            </div>
        </div>

        <!-- 화면 4: 랭킹 화면 -->
        <div id="screen-leaderboard" class="hidden space-y-6">
            <div class="flex items-center justify-between border-b pb-4">
                <h2 class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-crown text-amber-500"></i> 명예의 전당 (Top 10)
                </h2>
                <button onclick="showStartScreen()" class="text-sm font-bold text-indigo-600 hover:text-indigo-800">
                    <i class="fa-solid fa-house mr-1"></i> 메인으로
                </button>
            </div>

            <div id="leaderboard-list" class="space-y-2"></div>

            <div class="pt-4 flex gap-3">
                <button onclick="clearLeaderboard()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-xl text-xs transition">
                    <i class="fa-solid fa-trash-can mr-1"></i> 랭킹 초기화
                </button>
                <button onclick="startGame()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition text-center">
                    바로 퀴즈 풀기
                </button>
            </div>
        </div>

    </div>

    <script>
        // 일본어 단어 데이터베이스 (미래엔 5단원 - 한자 제거)
        const WORD_DATABASE = [
            { id: 1, kana: "うえ", mean: "위", hint: "위쪽/상단을 의미합니다." },
            { id: 2, kana: "した", mean: "아래", hint: "아래쪽/하단을 의미합니다." },
            { id: 3, kana: "なか", mean: "안", hint: "상자나 공간의 내부/안쪽을 의미합니다." },
            { id: 4, kana: "となり", mean: "(바로) 옆", hint: "바로 이어지는 옆자리를 의미합니다." },
            { id: 5, kana: "まえ", mean: "앞", hint: "전방 또는 앞쪽을 의미합니다." },
            { id: 6, kana: "うしろ", mean: "뒤", hint: "후방 또는 뒤쪽을 의미합니다." },
            { id: 7, kana: "みぎ", mean: "오른쪽", hint: "오른쪽 방향을 의미합니다." },
            { id: 8, kana: "ひだり", mean: "왼쪽", hint: "왼쪽 방향을 의미합니다." },
            { id: 9, kana: "よこ", mean: "(가로) 옆", hint: "수평 측면의 옆을 의미합니다." },
            { id: 10, kana: "あります", mean: "(사물) 있습니다", hint: "무생물(사물, 식물)이 있을 때 사용합니다." },
            { id: 11, kana: "せんせい", mean: "선생님", hint: "선생님을 부르는 말입니다." },
            { id: 12, kana: "いす", mean: "의자", hint: "앉는 가구인 의자입니다." },
            { id: 13, kana: "つくえ", mean: "책상", hint: "공부할 때 쓰는 책상입니다." },
            { id: 14, kana: "あのう", mean: "저, 저기", hint: "말을 건넬 때 정중히 부르는 표현입니다." },
            { id: 15, kana: "バスてい", mean: "버스 정류장", hint: "버스를 기다리는 곳입니다." },
            { id: 16, kana: "どこ", mean: "어디", hint: "장소를 묻는 의문사입니다." },
            { id: 17, kana: "コンビニ", mean: "편의점", hint: "편의점을 뜻하는 가타카나 단어입니다." },
            { id: 18, kana: "としょかん", mean: "도서관", hint: "책을 빌리고 공부하는 도서관입니다." },
            { id: 19, kana: "こうえん", mean: "공원", hint: "산책하고 휴식하는 공원입니다." },
            { id: 20, kana: "ゆうびんきょく", mean: "우체국", hint: "편지와 택배를 보낼 수 있는 곳입니다." },
            { id: 21, kana: "えき", mean: "역", hint: "전철이나 기차를 타는 역입니다." },
            { id: 22, kana: "こうばん", mean: "파출소", hint: "동네 치안을 담당하는 파출소입니다." },
            { id: 23, kana: "いま", mean: "지금", hint: "현재 시점을 나타냅니다." },
            { id: 24, kana: "います", mean: "(사람/동물) 있습니다", hint: "사람이나 동물이 존재할 때 씁니다." },
            { id: 25, kana: "えいがかん", mean: "영화관", hint: "영화를 보는 극장/영화관입니다." },
            { id: 26, kana: "ゆうえんち", mean: "놀이공원", hint: "놀이기구가 있는 유원지입니다." },
            { id: 27, kana: "ぎんこう", mean: "은행", hint: "금융 업무를 보는 은행입니다." },
            { id: 28, kana: "くすりや", mean: "약국", hint: "약을 파는 약국입니다." },
            { id: 29, kana: "デパート", mean: "백화점", hint: "백화점을 뜻하는 가타카나 외래어입니다." },
            { id: 30, kana: "おいしかったです", mean: "맛있었습니다", hint: "'맛있다'의 정중한 과거형입니다." },
            { id: 31, kana: "たのしかったです", mean: "즐거웠습니다", hint: "'즐겁다'의 정중한 과거형입니다." },
            { id: 32, kana: "きれいでした", mean: "예뻤습니다 / 깨끗했습니다", hint: "예쁘거나 깨끗했다는 과거 표현입니다." },
            { id: 33, kana: "にぎやかでした", mean: "북적였습니다", hint: "번화하거나 북적였다는 과거 상태 표현입니다." },
            { id: 34, kana: "すてきだ", mean: "멋지다", hint: "근사하고 멋지다는 표현입니다." },
            { id: 35, kana: "とけい", mean: "시계", hint: "시간을 보는 시계입니다." },
            { id: 36, kana: "うた", mean: "노래", hint: "음악 노래를 뜻합니다." },
            { id: 37, kana: "でも", mean: "하지만", hint: "문장을 연결하는 반대 접속사입니다." },
            { id: 38, kana: "まだまだ", mean: "아직(도)", hint: "겸손하게 칭찬을 부인할 때 자주 씁니다." },
            { id: 39, kana: "そんな こと ありません", mean: "그렇지 않습니다", hint: "칭찬에 겸손하게 대답할 때 씁니다." },
            { id: 40, kana: "え", mean: "그림", hint: "그려진 그림을 뜻합니다." },
            { id: 41, kana: "はなびたいかい", mean: "불꽃 축제", hint: "여름에 주로 열리는 불꽃 축제입니다." },
            { id: 42, kana: "おきなわ", mean: "오키나와", hint: "일본 남쪽의 유명 휴양지입니다." },
            { id: 43, kana: "バイト", mean: "아르바이트", hint: "아르바이트의 줄임말입니다." },
            { id: 44, kana: "たいへんだ", mean: "힘들다 / 큰일이다", hint: "고되거나 힘든 상태입니다." }
        ];

        let totalQuestionsCount = 10;
        let currentQuestionIndex = 0;
        let score = 0;
        let combo = 0;
        let quizList = [];
        let wrongAnswers = [];
        let playerName = "";
        let isAnswerSubmitted = false;

        function speakJapanese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function showScreen(screenId) {
            ['screen-start', 'screen-quiz', 'screen-result', 'screen-leaderboard'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showStartScreen() {
            showScreen('screen-start');
        }

        function selectQuestionCount(count) {
            totalQuestionsCount = count;
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.className = "count-btn p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-between";
                btn.querySelector('i').className = "fa-regular fa-circle";
            });
            
            const activeBtn = document.getElementById(`btn-count-${count}`);
            activeBtn.className = "count-btn p-4 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 font-bold flex items-center justify-between";
            activeBtn.querySelector('i').className = "fa-solid fa-circle-check";
        }

        function generateQuizList(count) {
            const shuffled = [...WORD_DATABASE].sort(() => Math.random() - 0.5);
            const selectedWords = shuffled.slice(0, Math.min(count, shuffled.length));

            return selectedWords.map((item, index) => {
                const isMeaningQuestion = (index % 2 === 0);
                const otherWords = WORD_DATABASE.filter(w => w.id !== item.id);
                const shuffledOthers = otherWords.sort(() => Math.random() - 0.5).slice(0, 3);

                let options = [];
                if (isMeaningQuestion) {
                    options = [item.mean, ...shuffledOthers.map(o => o.mean)];
                } else {
                    options = [item.kana, ...shuffledOthers.map(o => o.kana)];
                }

                options.sort(() => Math.random() - 0.5);

                return {
                    targetWord: item,
                    type: isMeaningQuestion ? 'MEANING' : 'KANA',
                    questionText: isMeaningQuestion ? item.kana : item.mean,
                    correctAnswerText: isMeaningQuestion ? item.mean : item.kana,
                    options: options,
                    distractors: shuffledOthers
                };
            });
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) {
                alert('학생 이름을 입력해주세요!');
                document.getElementById('player-name').focus();
                return;
            }
            playerName = nameInput;
            score = 0;
            combo = 0;
            currentQuestionIndex = 0;
            wrongAnswers = [];

            quizList = generateQuizList(totalQuestionsCount);
            
            document.getElementById('current-score').innerText = score;
            document.getElementById('combo-count').innerText = combo;

            showScreen('screen-quiz');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswerSubmitted = false;
            const q = quizList[currentQuestionIndex];

            document.getElementById('quiz-progress-text').innerText = `${currentQuestionIndex + 1} / ${quizList.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / quizList.length) * 100}%`;
            
            const badge = document.getElementById('quiz-type-badge');
            const category = document.getElementById('question-category');
            
            if (q.type === 'MEANING') {
                badge.innerText = "뜻 맞추기 (50%)";
                badge.className = "text-xs font-semibold px-2 py-1 bg-indigo-100 text-indigo-700 rounded-md";
                category.innerText = "Q. 제시된 일본어의 올바른 한국어 뜻을 고르세요";
            } else {
                badge.innerText = "히라가나 맞추기 (50%)";
                badge.className = "text-xs font-semibold px-2 py-1 bg-emerald-100 text-emerald-700 rounded-md";
                category.innerText = "Q. 제시된 한국어 뜻에 알맞은 일본어 표현을 고르세요";
            }

            document.getElementById('question-word').innerText = q.questionText;
            speakJapanese(q.targetWord.kana);

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 text-left font-semibold rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-800 transition flex items-center justify-between text-base md:text-lg shadow-sm";
                
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold">${idx + 1}</span>
                        <span class="${q.type === 'KANA' ? 'jp-text' : ''}">${opt}</span>
                    </span>
                    <i class="fa-regular fa-circle text-slate-300 option-check"></i>
                `;
                
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });

            document.getElementById('feedback-box').className = "hidden p-4 rounded-2xl border text-sm font-medium transition-all";
            document.getElementById('btn-next').classList.add('hidden');
        }

        function playCurrentQuestionAudio() {
            const q = quizList[currentQuestionIndex];
            speakJapanese(q.targetWord.kana);
        }

        function checkAnswer(selectedOpt, selectedBtn) {
            if (isAnswerSubmitted) return;
            isAnswerSubmitted = true;

            const q = quizList[currentQuestionIndex];
            const isCorrect = (selectedOpt === q.correctAnswerText);

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const optText = btn.querySelector('span > span:nth-child(2)').innerText;
                if (optText === q.correctAnswerText) {
                    btn.classList.remove('border-slate-200', 'bg-white');
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    btn.querySelector('.option-check').className = "fa-solid fa-circle-check text-emerald-500";
                }
            });

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');

            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                combo++;
                const gainedScore = 10 + (combo * 2);
                score += gainedScore;

                selectedBtn.classList.remove('border-slate-200', 'bg-white');
                selectedBtn.classList.add('border-emerald-500', 'bg-emerald-50');

                feedbackBox.className = "p-4 rounded-2xl border border-emerald-200 bg-emerald-50 text-emerald-900 transition-all";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                feedbackTitle.innerText = `정답입니다! (+${gainedScore}점)`;
                feedbackDesc.innerText = `발음: [${q.targetWord.kana}] / 뜻: [${q.targetWord.mean}] — ${q.targetWord.hint}`;

                document.getElementById('current-score').innerText = score;
                document.getElementById('combo-count').innerText = combo;
            } else {
                combo = 0;
                document.getElementById('combo-count').innerText = combo;

                selectedBtn.classList.remove('border-slate-200', 'bg-white');
                selectedBtn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                selectedBtn.querySelector('.option-check').className = "fa-solid fa-circle-xmark text-rose-500";

                feedbackBox.className = "p-4 rounded-2xl border border-rose-200 bg-rose-50 text-rose-900 transition-all";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-600"></i>`;
                feedbackTitle.innerText = `아쉽네요! 오답입니다.`;
                feedbackDesc.innerText = `올바른 답은 [${q.correctAnswerText}] 입니다. (${q.targetWord.hint})`;

                wrongAnswers.push({
                    questionNum: currentQuestionIndex + 1,
                    kana: q.targetWord.kana,
                    mean: q.targetWord.mean,
                    selected: selectedOpt,
                    correct: q.correctAnswerText,
                    hint: q.targetWord.hint,
                    type: q.type
                });
            }

            speakJapanese(q.targetWord.kana);
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizList.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            showScreen('screen-result');

            const total = quizList.length;
            const correctCount = total - wrongAnswers.length;
            const accuracy = Math.round((correctCount / total) * 100);

            document.getElementById('result-greeting').innerText = `${playerName} 학생, 수고하셨습니다!`;
            document.getElementById('final-score').innerText = `${score}점`;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            document.getElementById('final-correct-count').innerText = `${correctCount} / ${total}`;

            const feedbackList = document.getElementById('incorrect-feedback-list');
            feedbackList.innerHTML = '';

            if (wrongAnswers.length === 0) {
                feedbackList.innerHTML = `
                    <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 text-center text-emerald-800 font-bold">
                        <i class="fa-solid fa-award text-emerald-600 text-xl mb-1 block"></i>
                        만점입니다! 모든 단어를 완벽하게 알고 계시네요!
                    </div>
                `;
            } else {
                wrongAnswers.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "p-3.5 bg-rose-50/70 border border-rose-200 rounded-xl text-xs space-y-1.5";
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-rose-700">Q${item.questionNum}. [${item.kana}] - ${item.mean}</span>
                            <button onclick="speakJapanese('${item.kana}')" class="px-2 py-0.5 bg-rose-200 hover:bg-rose-300 text-rose-800 rounded font-semibold text-[11px] flex items-center gap-1">
                                <i class="fa-solid fa-volume-high"></i> 듣기
                            </button>
                        </div>
                        <div class="text-slate-600">
                            내가 쓴 답: <span class="line-through text-rose-600 font-semibold">${item.selected}</span> ➔ 
                            정답: <span class="text-emerald-700 font-bold">${item.correct}</span>
                        </div>
                        <div class="text-slate-500 italic bg-white/60 p-2 rounded border border-rose-100">
                            💡 피드백: ${item.hint}
                        </div>
                    `;
                    feedbackList.appendChild(card);
                });
            }

            saveRank(playerName, score, accuracy);
        }

        function saveRank(name, score, accuracy) {
            let rankings = JSON.parse(localStorage.getItem('jp_quiz_rankings') || '[]');
            const newRecord = {
                name: name,
                score: score,
                accuracy: accuracy,
                date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' })
            };

            rankings.push(newRecord);
            rankings.sort((a, b) => b.score - a.score || b.accuracy - a.accuracy);
            rankings = rankings.slice(0, 10);

            localStorage.setItem('jp_quiz_rankings', JSON.stringify(rankings));
        }

        function showLeaderboardScreen() {
            showScreen('screen-leaderboard');
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const listContainer = document.getElementById('leaderboard-list');
            const rankings = JSON.parse(localStorage.getItem('jp_quiz_rankings') || '[]');

            listContainer.innerHTML = '';

            if (rankings.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-400 font-medium">
                        아직 등록된 랭킹 기록이 없습니다.<br>첫 번째로 도전해보세요!
                    </div>
                `;
                return;
            }

            rankings.forEach((item, index) => {
                const rankItem = document.createElement('div');
                let medalBg = "bg-slate-100 text-slate-600";
                let medalIcon = `${index + 1}위`;

                if (index === 0) {
                    medalBg = "bg-amber-100 text-amber-600 font-extrabold";
                    medalIcon = `<i class="fa-solid fa-crown"></i> 1위`;
                } else if (index === 1) {
                    medalBg = "bg-slate-200 text-slate-700 font-extrabold";
                    medalIcon = `2위`;
                } else if (index === 2) {
                    medalBg = "bg-amber-800/10 text-amber-800 font-extrabold";
                    medalIcon = `3위`;
                }

                rankItem.className = "flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-200";
                rankItem.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="px-3 py-1.5 rounded-xl text-xs ${medalBg}">${medalIcon}</span>
                        <div>
                            <div class="font-bold text-slate-800 text-sm md:text-base">${item.name}</div>
                            <div class="text-xs text-slate-400">${item.date} · 정답률 ${item.accuracy}%</div>
                        </div>
                    </div>
                    <div class="font-black text-indigo-600 text-base md:text-lg">
                        ${item.score}점
                    </div>
                `;
                listContainer.appendChild(rankItem);
            });
        }

        function clearLeaderboard() {
            if (confirm('정말로 모든 랭킹 기록을 삭제하시겠습니까?')) {
                localStorage.removeItem('jp_quiz_rankings');
                renderLeaderboard();
            }
        }
    </script>
</body>
</html>
